# http düzeyi ayarlar (üretim). Sunucu blokları: templates/default.conf.template

server_tokens off;
charset utf-8;

# Ekler en çok 20 MB (ATTACHMENT_MAX_BYTES); çok parçalı form başlıkları için pay.
client_max_body_size 25m;
client_body_timeout 30s;
client_header_timeout 15s;
send_timeout 60s;

# Docker'ın gömülü DNS'i: backend konteyneri yeniden oluşturulup IP'si değişince nginx yeniden
# başlatılmadan yeni adrese gider (upstream "resolve").
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/javascript text/xml
    application/javascript application/json application/manifest+json application/xml
    application/vnd.oai.openapi application/vnd.oai.openapi+json
    image/svg+xml;

# --- TLS ---------------------------------------------------------------------------------------
# Sertifika host'taki ./nginx/certs klasöründen bağlanır (bkz. docs/KURULUM.md "Sertifika").
ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
# Mozilla "intermediate" listesi (TLS 1.2 için; TLS 1.3 şifreleri ayrıca seçilmez)
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- WebSocket ---------------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- iç ağ / VPN izin listesi ------------------------------------------------------------------
# /admin/, /api/docs/ ve /api/schema/ yalnızca bu ağlardan açılır. Liste, konteyner açılışında
# INTERNAL_NETWORKS ortam değişkeninden üretilir (docker-entrypoint.d/05-deterjan-erp.sh).
geo $internal_client {
    default 0;
    include /etc/nginx/internal-networks.conf;
}

# --- giriş denemesi sınırı ---------------------------------------------------------------------
# Asıl sınır Django'dadır (LOGIN_RATE_LIMIT); bu, kaba kuvvet denemelerine karşı ikinci savunma.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
    keepalive 16;
}
