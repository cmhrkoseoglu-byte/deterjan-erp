# /api/docs/ (drf-spectacular Swagger UI): betik, stil ve görseller cdn.jsdelivr.net'ten yüklenir.
include /etc/nginx/snippets/security-headers-common.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
