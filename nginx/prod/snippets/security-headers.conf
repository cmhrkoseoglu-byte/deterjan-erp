# Uygulama (SPA + API) için güvenlik başlıkları. Mantine satır içi stil kullandığı için
# style-src 'unsafe-inline' gerekir; betikler yalnızca kendi origin'imizden.
include /etc/nginx/snippets/security-headers-common.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$host; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
