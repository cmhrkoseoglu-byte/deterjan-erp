# Backend'e (uvicorn) giden her istek için ortak başlıklar.
# TLS nginx'te sonlanır: X-Forwarded-Proto her zaman "https" yazılır (istemcinin gönderdiği
# değer ezilir). X-Forwarded-For da istemcinin zincirine eklenmez, doğrudan bağlanan adresle
# değiştirilir; nginx en dıştaki sunucudur, sahte IP zinciri backend'e ulaşmaz.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;

proxy_connect_timeout 10s;

# Güvenlik başlıklarını yalnızca nginx yazar (Django'nun aynı başlıkları çift görünmesin).
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Content-Security-Policy;
