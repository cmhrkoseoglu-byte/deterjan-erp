# Her yanıtta olması gereken güvenlik başlıkları (CSP hariç).
# DİKKAT: nginx'te bir location kendi add_header'ını tanımlarsa üst düzeydekiler miras alınmaz;
# bu yüzden bu dosya (security-headers.conf / security-headers-docs.conf üzerinden) HER location'a
# ayrı ayrı eklenir.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
