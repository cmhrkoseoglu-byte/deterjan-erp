# Üretim ortamı İSKELETİ. Faz 5'te barındırma kararıyla (yerel sunucu / bulut) tamamlanacak.
# Kullanım (taslak): docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Yapılacaklar (Faz 5):
# - frontend: Vite dev server yerine derlenmiş statik dosyalar (nginx ile servis)
# - backend: kaynak kod volume'ü olmadan, --reload olmadan, birden çok worker
# - nginx: HTTPS sertifikası, statik/medya dosyaları
# - yedekleme: PostgreSQL için düzenli yedek

services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    # Ekler (core.Attachment) kalıcı volume'de; S3 uyumlu depoya geçilebilir (Adım 2.4).
    volumes: !override
      - media:/app/media
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped

  worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes: !reset []
    restart: unless-stopped

  beat:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes: !reset []
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  nginx:
    restart: unless-stopped

volumes:
  media:
